# Expected template and params for each line of known.log (line number -> template).
# Lines with the same template differ only by their variables; the others must differ.
# Line 3 is the merge case: masking gives <IPV6> where lines 1-2 give <IP>, and the
# single-placeholder merge unifies the three as <*>.
1: {template: 'Connected to <*> in <DURATION>', params: ['10.0.0.5', '12ms']}
2: {template: 'Connected to <*> in <DURATION>', params: ['192.168.1.20', '340ms']}
3: {template: 'Connected to <*> in <DURATION>', params: ['fe80::1', '2s']}
4: {template: 'Disk <PATH> at <NUM>% capacity', params: ['/var/lib/data', '91']}
5: {template: 'Disk <PATH> at <NUM>% capacity', params: ['/mnt/backup', '97']}
6: {template: 'Request <UUID> failed with status <NUM>', params: ['3f2504e0-4f89-11d3-9a0c-0305e82c3301', '503']}
7: {template: 'Request <UUID> failed with status <NUM>', params: ['9b2d1c3e-1111-4abc-8def-0123456789ab', '500']}
8: {template: 'User <EMAIL> logged in from <IP>', params: ['alice@example.com', '10.0.0.7']}
9: {template: 'User <EMAIL> logged in from <IP>', params: ['bob@example.org', '10.0.0.8']}
10: {template: 'Uploaded <SIZE> to <URL>', params: ['12.5 MB', 'https://cdn.example.com/a/b.bin']}
11: {template: 'Uploaded <SIZE> to <URL>', params: ['3 GB', 'https://cdn.example.com/c.iso']}
12: {template: 'Cache miss for key <HEX>', params: ['0x7f3a9c']}
13: {template: 'Cache miss for key <HEX>', params: ['0xdeadbeef']}
14: {template: 'Connection reset by peer', params: []}
15: {template: 'Device <MAC> joined', params: ['00:1A:2B:3C:4D:5E']}
16: {template: 'Device <MAC> joined', params: ['00:1A:2B:3C:4D:5F']}
17: {template: 'Scheduled job at <DATETIME>', params: ['2026-03-15T02:00:00Z']}
18: {template: 'Scheduled job at <DATETIME>', params: ['2026-03-16T02:00:00Z']}
19: {template: 'Worker <NUM> picked task <NUM>', params: ['7', '991']}
