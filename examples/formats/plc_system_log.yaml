name: plc_system_log
description: Industrial PLC system logs with timestamps, device components, level codes, and event messages.
regex:
- ^(?P<timestamp>\d{2}\.\d{2}\.\d{2} \d{2}:\d{2}:\d{2},\d{3})\s+(?P<component>\S+)\s+(?P<level>ALM|FLT|WRN|INF|ACK)\s+(?P<code_id>\d+)\s+(?P<message>.*)
priority: 90
timestamp_format:
- '%d.%m.%y %H:%M:%S,%f'
level:
  group: level
  map:
    ALM: ERROR
    FLT: FATAL
    WRN: WARN
    INF: INFO
    ACK: INFO
record_start: ^\d{2}\.\d{2}\.\d{2} \d{2}:\d{2}:\d{2},\d{3}
