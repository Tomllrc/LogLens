[project]
name = "loglens"
version = "0.1.0"
description = "Open-source, AI-powered log investigation tool: any log in, structured events, recurring issues, and cited answers out."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "charset-normalizer>=3.5.1",
    "drain3>=0.9.11",
    "duckdb>=1.0",
    "polars>=1.0",
    "pyarrow>=15.0",
    "pytz>=2026.5",
    "pyyaml>=6.0.3",
    "rich>=13.0",
    "typer>=0.12",
    "tzdata>=2026.5",
]
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
loglens = "loglens.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loglens"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# Third-party libraries without type information: imports are typed as Any.
module = ["pyarrow", "pyarrow.*", "drain3", "drain3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.coverage.run]
source = ["loglens"]
branch = true
